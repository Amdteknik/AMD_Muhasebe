name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config || true
          python3 -m pip install --upgrade pip
          pip install kivy-ios

      - name: Build Python and Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          # Eğer kodların "AMD Muhasebe" klasörünün içindeyse oraya odaklanıyoruz
          # Klasör adındaki boşluğu sildik veya tırnak içine aldık
          toolchain create "AMDMuhasebe" .
          
      - name: Archive Xcode Project
        run: |
          zip -r AMDMuhasebe_Xcode.zip AMDMuhasebe-ios

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: AMDMuhasebe_Xcode.zip
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: AMDMuhasebe_Xcode.zip
