name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config || true
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.33
          pip install kivy-ios

      - name: Build Python and Kivy
        run: |
          toolchain build python3 kivy

      - name: Create and Export IPA
        run: |
          # Projeyi oluştur
          toolchain create "AMDMuhasebe" .
          # IPA olarak dışa aktar (Sideloadly için hazır hale getirir)
          # Bu komut projenin içine her şeyi gömer
          cd AMDMuhasebe-ios
          mkdir -p Payload/AMDMuhasebe.app
          cp -r * Payload/AMDMuhasebe.app/ || true
          zip -r ../AMDMuhasebe.ipa Payload
          
      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: AMDMuhasebe-Kurulum-Dosyasi
          path: AMDMuhasebe.ipa
